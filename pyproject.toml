[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "mycelium"
description = "Agent communication layer: every agent knows its manager, peers and reports, and gets its mail."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# The version comes from the vX.Y.Z git tag (docs/decisions/dependency-adoption.md).
dynamic = ["version"]
# Standard library only at runtime (KTD11).
dependencies = []

[project.scripts]
mycelium = "mycelium.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/mycelium"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
